<!DOCTYPE html>
<html lang="ko">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <style>
    :root { --navy:#102a43; --blue:#1769aa; --pale:#eef5fb; --line:#e5eaf0; --muted:#667085; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Arial,"Noto Sans KR",sans-serif; color:#182230; background:#f6f8fb; }
    header { background:linear-gradient(120deg,#102a43,#1769aa); color:white; padding:28px max(20px,calc((100% - 1040px)/2)); }
    .brand { font-size:13px; letter-spacing:2px; opacity:.85; font-weight:700; }
    h1 { margin:9px 0 5px; font-size:30px; }
    header p { margin:0; color:#dceaf6; font-size:14px; }
    main { max-width:1040px; margin:28px auto; padding:0 18px 60px; }
    .toolbar { background:white; border:1px solid var(--line); border-radius:14px; padding:18px; box-shadow:0 4px 16px #14283b08; }
    .tabs { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
    button,.tab { border:1px solid var(--line); background:white; border-radius:9px; padding:9px 14px; cursor:pointer; font-size:14px; color:#344054; }
    .tab.active { background:var(--navy); border-color:var(--navy); color:white; }
    .searchrow { display:flex; gap:9px; }
    input { flex:1; min-width:0; border:1px solid #d0d5dd; border-radius:9px; padding:12px; font-size:14px; }
    .primary { background:var(--blue); color:white; border-color:var(--blue); font-weight:700; }
    .meta { display:flex; justify-content:space-between; gap:10px; align-items:center; color:var(--muted); font-size:12px; margin:18px 2px 10px; }
    #list { display:grid; gap:10px; }
    .notice { background:white; border:1px solid var(--line); border-radius:13px; padding:17px 18px; }
    .topline { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:9px; }
    .pill { font-size:11px; padding:4px 8px; border-radius:20px; background:var(--pale); color:#175b91; font-weight:700; }
    .date,.campus { color:var(--muted); font-size:12px; }
    .notice h3 { margin:0 0 12px; font-size:16px; line-height:1.55; }
    .actions { display:flex; gap:8px; flex-wrap:wrap; }
    .actions a { text-decoration:none; color:var(--blue); border:1px solid #cfe0ef; border-radius:8px; padding:7px 10px; font-size:12px; }
    .summary { white-space:pre-wrap; background:#f7faff; border-left:3px solid var(--blue); padding:12px; margin-top:12px; border-radius:5px; font-size:13px; line-height:1.65; }
    .empty { text-align:center; padding:48px 16px; background:white; border:1px dashed #cbd5e1; border-radius:12px; color:var(--muted); }
    #status { color:var(--muted); font-size:12px; margin-top:10px; min-height:18px; }
    footer { color:#98a2b3; text-align:center; font-size:11px; margin-top:28px; line-height:1.7; }
    @media(max-width:560px) { h1{font-size:25px}.searchrow{flex-direction:column}.searchrow button{width:100%}.meta{align-items:flex-start;flex-direction:column} }
  </style>
</head>
<body>
<header>
  <div class="brand">KANGWON NATIONAL UNIVERSITY</div>
  <h1>KNU INFO</h1>
  <p>학사공지와 장학공지를 한곳에서 확인하세요.</p>
</header>
<main>
  <section class="toolbar">
    <div class="tabs">
      <button class="tab active" data-category="전체">전체</button>
      <button class="tab" data-category="학사공지">학사공지</button>
      <button class="tab" data-category="장학공지">장학공지</button>
    </div>
    <div class="searchrow">
      <input id="query" type="search" placeholder="공지 제목, 캠퍼스, 작성 부서 검색">
      <button class="primary" onclick="loadNotices()">검색</button>
      <button onclick="refresh()">새로고침</button>
    </div>
    <div id="status"></div>
  </section>
  <div class="meta"><span id="count">공지사항을 불러오는 중...</span><span id="updated"></span></div>
  <section id="list"></section>
  <footer>본 서비스는 강원대학교 공식 공지사항을 편리하게 확인하기 위한 비공식 웹앱입니다.<br>
    정확한 내용·첨부파일·신청 조건은 반드시 학교 공식 홈페이지 원문에서 확인하세요.</footer>
</main>
<script>
  let currentCategory = '전체';
  document.querySelectorAll('.tab').forEach(btn => btn.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    btn.classList.add('active'); currentCategory = btn.dataset.category; loadNotices();
  }));
  document.getElementById('query').addEventListener('keydown', e => { if(e.key === 'Enter') loadNotices(); });

  function setStatus(text) { document.getElementById('status').textContent = text || ''; }
  function loadNotices() {
    setStatus('공지 목록을 불러오는 중...');
    google.script.run.withSuccessHandler(render).withFailureHandler(err => setStatus(err.message))
      .getNotices({category:currentCategory, query:document.getElementById('query').value});
  }
  function render(data) {
    const list = document.getElementById('list');
    document.getElementById('count').textContent = '검색 결과 ' + data.notices.length + '건';
    document.getElementById('updated').textContent = data.updatedAt ? '마지막 수집: ' + data.updatedAt : '아직 수집 전';
    setStatus(data.message || '');
    if (!data.notices.length) {
      list.innerHTML = '<div class="empty">표시할 공지가 없습니다.<br>처음 사용하는 경우 새로고침을 눌러 공지를 수집해 주세요.</div>'; return;
    }
    list.innerHTML = data.notices.map(n => `
      <article class="notice">
        <div class="topline"><span class="pill">${escapeHtml(n.category)}</span>
          <span class="date">${escapeHtml(n.date || '날짜 확인 필요')}</span>
          <span class="campus">${escapeHtml(n.campus)}</span></div>
        <h3>${escapeHtml(n.title)}</h3>
        <div class="actions">
          <a href="${escapeAttr(n.url)}" target="_blank" rel="noopener">학교 원문 보기 ↗</a>
          <button onclick="summarize('${escapeAttr(n.id)}', this)">AI 핵심 요약</button>
        </div>
        <div class="summary" id="summary-${escapeAttr(n.id)}" hidden>${escapeHtml(n.summary || '')}</div>
      </article>`).join('');
    data.notices.forEach(n => { if(n.summary) document.getElementById('summary-'+n.id).hidden = false; });
  }
  function refresh() {
    setStatus('학교 홈페이지에서 최신 공지를 수집하고 있습니다...');
    google.script.run.withSuccessHandler(result => {
      setStatus(result.count + '건 수집 완료 (' + result.updatedAt + ')');
      loadNotices();
    }).withFailureHandler(err => setStatus('수집 실패: ' + err.message)).refreshNotices();
  }
  function summarize(id, button) {
    const panel = document.getElementById('summary-'+id);
    if (!panel.hidden && panel.textContent.trim()) { panel.hidden = false; return; }
    button.disabled = true; button.textContent = '요약 중...'; setStatus('Gemini가 공지 내용을 분석하고 있습니다...');
    google.script.run.withSuccessHandler(text => {
      panel.textContent = text; panel.hidden = false; button.disabled = false; button.textContent = 'AI 요약 다시 보기'; setStatus('');
    }).withFailureHandler(err => {
      button.disabled = false; button.textContent = 'AI 핵심 요약'; setStatus('요약 실패: ' + err.message);
    }).summarizeNotice(id);
  }
  function escapeHtml(s) {
    return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function escapeAttr(s) { return escapeHtml(s).replace(/`/g, '&#96;'); }
  loadNotices();
</script>
</body>
</html>
