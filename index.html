<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KNU INFO | 강원대학교 공지 통합</title>
<style>
:root{--navy:#102a43;--blue:#1769aa;--pale:#eef5fb;--line:#e5eaf0;--muted:#667085}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,"Noto Sans KR",sans-serif;color:#182230;background:#f6f8fb}
header{background:linear-gradient(120deg,#102a43,#1769aa);color:white;padding:28px max(20px,calc((100% - 1040px)/2))}
.brand{font-size:13px;letter-spacing:2px;opacity:.85;font-weight:700}
h1{margin:9px 0 5px;font-size:30px}
header p{margin:0;color:#dceaf6;font-size:14px}
main{max-width:1040px;margin:28px auto;padding:0 18px 60px}
.toolbar{background:white;border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 4px 16px #14283b08}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
button,.tab{border:1px solid var(--line);background:white;border-radius:9px;padding:9px 14px;cursor:pointer;font-size:14px;color:#344054}
.tab.active{background:var(--navy);border-color:var(--navy);color:white}
.searchrow{display:flex;gap:9px}
input{flex:1;min-width:0;border:1px solid #d0d5dd;border-radius:9px;padding:12px;font-size:14px}
.primary{background:var(--blue);color:white;border-color:var(--blue);font-weight:700}
.meta{display:flex;justify-content:space-between;gap:10px;align-items:center;color:var(--muted);font-size:12px;margin:18px 2px 10px}
#list{display:grid;gap:10px}
.notice{background:white;border:1px solid var(--line);border-radius:13px;padding:17px 18px}
.topline{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:9px}
.pill{font-size:11px;padding:4px 8px;border-radius:20px;background:var(--pale);color:#175b91;font-weight:700}
.date,.campus{color:var(--muted);font-size:12px}
.notice h3{margin:0 0 12px;font-size:16px;line-height:1.55}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.actions a{display:inline-block;text-decoration:none;color:var(--blue);border:1px solid #cfe0ef;border-radius:8px;padding:7px 10px;font-size:12px}
.summary{white-space:pre-wrap;background:#f7faff;border-left:3px solid var(--blue);padding:12px;margin-top:12px;border-radius:5px;font-size:13px;line-height:1.65}
.empty{text-align:center;padding:48px 16px;background:white;border:1px dashed #cbd5e1;border-radius:12px;color:var(--muted)}
#status{color:var(--muted);font-size:12px;margin-top:10px;min-height:18px}
footer{color:#98a2b3;text-align:center;font-size:11px;margin-top:28px;line-height:1.7}
button:disabled{opacity:.55;cursor:wait}
@media(max-width:560px){h1{font-size:25px}.searchrow{flex-direction:column}.searchrow button{width:100%}.meta{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<header><div class="brand">KANGWON NATIONAL UNIVERSITY</div><h1>KNU INFO</h1><p>학사공지와 장학공지를 한곳에서 확인하세요.</p></header>
<main>
<section class="toolbar">
<div class="tabs">
<button class="tab active" data-category="전체">전체</button>
<button class="tab" data-category="학사공지">학사공지</button>
<button class="tab" data-category="장학공지">장학공지</button>
</div>
<div class="searchrow">
<input id="query" type="search" placeholder="공지 제목, 캠퍼스, 작성 부서 검색">
<button class="primary" id="searchBtn">검색</button>
<button id="refreshBtn">새로고침</button>
</div>
<div id="status" role="status"></div>
</section>
<div class="meta"><span id="count">공지사항을 불러오는 중...</span><span id="updated"></span></div>
<section id="list"></section>
<footer>본 서비스는 강원대학교 공식 공지사항을 편리하게 확인하기 위한 비공식 웹앱입니다.<br>정확한 내용·첨부파일·신청 조건은 반드시 학교 공식 홈페이지 원문에서 확인하세요.</footer>
</main>
<script>
let currentCategory='전체';
const $=id=>document.getElementById(id);
document.querySelectorAll('.tab').forEach(btn=>btn.addEventListener('click',()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  btn.classList.add('active'); currentCategory=btn.dataset.category; loadNotices();
}));
$('searchBtn').addEventListener('click',loadNotices);
$('query').addEventListener('keydown',e=>{if(e.key==='Enter')loadNotices()});
$('refreshBtn').addEventListener('click',refresh);
function setStatus(text){$('status').textContent=text||''}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function loadNotices(){
  setStatus('공지 목록을 불러오는 중...');
  try{
    const p=new URLSearchParams({category:currentCategory,q:$('query').value});
    const r=await fetch('/api/notices?'+p.toString());
    const data=await r.json(); if(!r.ok) throw new Error(data.error||'공지 조회 실패');
    render(data);
  }catch(e){setStatus('불러오기 실패: '+e.message);$('list').innerHTML='<div class="empty">공지사항을 불러오지 못했습니다. 잠시 후 새로고침해 주세요.</div>'}
}
function render(data){
  $('count').textContent='검색 결과 '+data.notices.length+'건';
  $('updated').textContent=data.updatedAt?'조회 시각: '+data.updatedAt:'';
  setStatus(data.message||'');
  if(!data.notices.length){$('list').innerHTML='<div class="empty">표시할 공지가 없습니다.</div>';return}
  $('list').innerHTML=data.notices.map(n=>`
    <article class="notice">
      <div class="topline"><span class="pill">${esc(n.category)}</span><span class="date">${esc(n.date||'날짜 확인 필요')}</span><span class="campus">${esc(n.campus||'')}</span></div>
      <h3>${esc(n.title)}</h3>
      <div class="actions">
        <a href="${esc(n.url)}" target="_blank" rel="noopener noreferrer">학교 원문 보기 ↗</a>
        <button data-summary="${esc(n.id)}">AI 핵심 요약</button>
      </div>
      <div class="summary" id="summary-${esc(n.id)}" hidden>${esc(n.summary||'')}</div>
    </article>`).join('');
  document.querySelectorAll('[data-summary]').forEach(btn=>btn.addEventListener('click',()=>summarize(btn.dataset.summary,btn)));
  data.notices.forEach(n=>{if(n.summary){const el=$('summary-'+n.id);if(el)el.hidden=false}});
}
async function refresh(){
  const btn=$('refreshBtn');btn.disabled=true;setStatus('학교 홈페이지에서 최신 공지를 수집하고 있습니다...');
  try{
    const r=await fetch('/api/notices?refresh=1');const data=await r.json();
    if(!r.ok)throw new Error(data.error||'수집 실패');
    setStatus(data.count+'건 수집 완료');await loadNotices();
  }catch(e){setStatus('수집 실패: '+e.message)}
  finally{btn.disabled=false}
}
async function summarize(id,btn){
  const panel=$('summary-'+id);if(!panel.hidden&&panel.textContent.trim())return;
  btn.disabled=true;btn.textContent='요약 중...';setStatus('Gemini가 공지 내용을 분석하고 있습니다...');
  try{
    const r=await fetch('/api/summarize',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id})});
    const data=await r.json();if(!r.ok)throw new Error(data.error||'요약 실패');
    panel.textContent=data.summary;panel.hidden=false;setStatus('');
  }catch(e){setStatus('요약 실패: '+e.message)}
  finally{btn.disabled=false;btn.textContent='AI 핵심 요약'}
}
loadNotices();
</script>
</body>
</html>
